name: Build and publish app packages

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.8"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze lib test integration_test

      - name: Run unit tests
        run: flutter test

      - name: Build Android APKs for supported ABIs
        run: flutter build apk --release --split-per-abi

      - name: Build universal Android APK
        run: flutter build apk --release --target-platform android-arm,android-arm64,android-x64

      - name: Build unsigned iOS app bundle
        run: flutter build ios --release --no-codesign

      - name: Prepare release assets
        run: |
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release/Mathevo-Android-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release/Mathevo-Android-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk release/Mathevo-Android-x86_64.apk
          cp build/app/outputs/flutter-apk/app-release.apk release/Mathevo-Android-universal.apk
          ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app release/Mathevo-iOS-15.5+-unsigned.zip

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Mathevo ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            Android APKs are available as universal and ABI-specific downloads.

            The iOS bundle is unsigned and requires Apple signing and provisioning before it can be installed on an iPhone. The minimum supported iOS version is 15.5 due to the Google ML Kit dependency; iOS 10 is not supported.
          files: release/*
